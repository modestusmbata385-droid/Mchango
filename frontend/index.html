<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <meta
    name="theme-color"
    content="#111111"
  />

  <title>MCHANGO — Admin</title>

  <link
    rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤝</text></svg>"
  />

  <!-- Main CSS -->
  <link
    rel="stylesheet"
    href="css/style.css"
  />

  <!--
    jsPDF
    Used for generating PDF reports.
  -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
    defer
  ></script>

  <!--
    AutoTable
    Used to create tables inside the PDF.
  -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"
    defer
  ></script>
</head>

<body>

  <div id="app">

    <!-- =====================================================
         TOP BAR
         ===================================================== -->

    <header class="topbar">

      <div class="brand">

        <span class="mark">
          MCHANGO
        </span>

        <span class="brand-sub">
          Admin
        </span>

      </div>

      <button
        id="menu-toggle"
        class="icon-btn"
        type="button"
        aria-label="Fungua menu"
      >
        ☰
      </button>

    </header>


    <!-- =====================================================
         MAIN LAYOUT
         ===================================================== -->

    <div class="layout">

      <!-- ===================================================
           SIDEBAR / NAVIGATION
           =================================================== -->

      <aside
        id="sidebar"
        class="sidebar"
      >

        <nav>

          <button
            class="nav-item active"
            data-page="dashboard"
            type="button"
          >
            📊
            <span>Dashboard</span>
          </button>


          <button
            class="nav-item"
            data-page="washiriki"
            type="button"
          >
            👥
            <span>Washiriki</span>
          </button>


          <button
            class="nav-item"
            data-page="malipo"
            type="button"
          >
            💰
            <span>Malipo</span>
          </button>


          <button
            class="nav-item"
            data-page="maombi"
            type="button"
          >
            📥
            <span>Maombi</span>
          </button>


          <button
            class="nav-item"
            data-page="gharama"
            type="button"
          >
            💸
            <span>Gharama</span>
          </button>


          <button
            class="nav-item"
            data-page="settings"
            type="button"
          >
            ⚙️
            <span>Settings</span>
          </button>


          <button
            class="nav-item"
            data-page="pdf"
            type="button"
          >
            📄
            <span>PDF Report</span>
          </button>

        </nav>

      </aside>


      <!-- ===================================================
           PAGE CONTENT
           =================================================== -->

      <main
        id="main-content"
        class="main-content"
      >

        <div class="empty-state">

          <span class="emoji">
            ⏳
          </span>

          <p>
            Inapakia...
          </p>

        </div>

      </main>

    </div>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer class="tagline">
      MCHANGO · Mfumo wa kusimamia michango
    </footer>

  </div>


  <!-- =======================================================
       TOAST
       ======================================================= -->

  <div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
  ></div>


  <!-- =======================================================
       MODAL
       ======================================================= -->

  <div
    id="modal"
    class="modal"
    hidden
  >

    <div class="modal-backdrop"></div>

    <div class="modal-card">

      <button
        id="modal-close"
        class="modal-close"
        type="button"
        aria-label="Funga"
      >
        ×
      </button>

      <div id="modal-content"></div>

    </div>

  </div>


  <!-- =======================================================
       JAVASCRIPT
       ======================================================= -->

  <!-- API / Storage -->
  <script src="js/storage.js"></script>

  <!-- Main Admin App -->
  <script src="js/app.js"></script>

</body>
</html>
