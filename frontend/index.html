<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MCHANGO</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤝</text></svg>" />
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <div id="app">

    <div class="topbar">
      <div class="brand">
        <span class="mark">MCHANGO</span>
      </div>
      <button class="theme-toggle" id="btn-theme" aria-label="Badilisha mwanga">🌙</button>
<button class="icon-btn" id="btn-menu" aria-label="Fungua menyu">☰</button>
    </div>

    <main id="app-main"></main>

    <footer class="tagline">MCHANGO · dhibiti michango yako kwa urahisi</footer>
  </div>

  <!-- Drawer navigation -->
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div class="drawer-title">MCHANGO</div>
      <button class="icon-btn" id="btn-drawer-close" aria-label="Funga menyu">✕</button>
    </div>
    <div class="drawer-event" id="drawer-event"></div>
    <nav id="drawer-nav"></nav>
  </aside>

  <!-- Confirm modal -->
  <div class="modal-scrim" id="modal-scrim">
    <div class="modal">
      <h3 id="modal-title">Thibitisha</h3>
      <p id="modal-body">Una uhakika?</p>
      <div class="modal-actions">
        <button class="btn btn-outline" id="modal-cancel">Ghairi</button>
        <button class="btn btn-danger" id="modal-confirm">Thibitisha</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="js/loader.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
